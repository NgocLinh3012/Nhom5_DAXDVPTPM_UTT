services:
  app:
    build: .
    container_name: utt_exam_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: thitracnghiem
      DB_USER: utt_user
      DB_PASS: utt_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: utt_exam_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: thitracnghiem
      MYSQL_USER: utt_user
      MYSQL_PASSWORD: utt_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/thitracnghiem.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: utt_exam_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: